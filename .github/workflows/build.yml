name: Build and test

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.x

      - name: Test
        uses: likvido/action-test@dfcc12addd37cd857fee70869fb2c7c0692604d5
        with:
          test-target: src/Likvido.Robot.sln
